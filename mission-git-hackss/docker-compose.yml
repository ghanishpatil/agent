version: '3.8'

services:
  md-exploit-engine:
    build: .
    container_name: md-exploit-engine
    ports:
      - "5000:5000"
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./challenges:/app/challenges
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py --web --host 0.0.0.0 --port 8080
    restart: unless-stopped
    networks:
      - ctf-network

  redis:
    image: redis:7-alpine
    container_name: md-exploit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ctf-network

networks:
  ctf-network:
    driver: bridge

volumes:
  redis-data:
