[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-agent-trust-kernel"
version = "0.1.0"
description = "Deterministic trust and control foundation for an authorized CTF agent"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310"]
